[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dsp"
version = "0.1.0"
description = "Deterministic classical DSP MVP for technical shot selection from .mov files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
ui = ["streamlit>=1.36"]

[project.scripts]
video-dsp = "video_dsp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
